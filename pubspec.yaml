name: cloak
description: "Cloak — chat with your choice of AI models while keeping your identity to yourself: a native Alt ID swaps personal details for a realistic stand-in, plus User-Agent and HTTP/SOCKS5 network obfuscation. Flutter (macOS/iOS/Android/Windows)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  uuid: ^4.5.1
  intl: ^0.20.2
  socks5_proxy: ^1.0.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/portraits/
    - assets/brand/
